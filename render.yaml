services:
  - type: web
    name: smart-banking-kiosk
    env: node
    plan: free
    buildCommand: npm install && npm run render-build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
