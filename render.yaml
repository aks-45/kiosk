services:
  - type: web
    name: kiosk-financial-terminal
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run render-build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: AI_PROVIDER
        value: gemini
      - key: DATABASE_URL
        value: file:./dev.db
      - key: GEMINI_API_KEY
        value: AIzaSyDj1qT4KuVVFnYknhUCnNVLVLkCQYKmgdg
